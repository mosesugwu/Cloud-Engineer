name: learn-github-actions
run-name: ${{ github.actor }} is learning Github Actions
on: [push] 
jobs:
  check-bats-version:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g bats && bats -v
      # - run: bats -v
